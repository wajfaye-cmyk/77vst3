name: Build 77.MP3

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (VST3 + Installer)
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(SEVENTYSEVEN_MP3 VERSION ([0-9.]+)'
          $v = $m.Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Check bundle
        shell: pwsh
        run: |
          $bundle = "build/SeventySevenMP3_artefacts/Release/VST3/77mp3.vst3"
          if (-not (Test-Path "$bundle/Contents/x86_64-win/77mp3.vst3")) { throw "VST3 binary not found in $bundle" }
          Get-ChildItem -Recurse $bundle | Select-Object FullName, Length

      # Optional code signing. Add repository secrets WINDOWS_CERT_PFX (base64 .pfx) and
      # WINDOWS_CERT_PASSWORD to sign both the plugin and the installer.
      - name: Sign plugin
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "77.MP3" `
            "build/SeventySevenMP3_artefacts/Release/VST3/77mp3.vst3/Contents/x86_64-win/77mp3.vst3"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}","$env:ProgramFiles" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue -Depth 2 | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}","$env:ProgramFiles" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue -Depth 2 | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.value }}" installer\77mp3.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign installer
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          Get-ChildItem dist\*.exe | ForEach-Object {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "77.MP3 Setup" $_.FullName
          }

      - name: Package VST3 (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/SeventySevenMP3_artefacts/Release/VST3/77mp3.vst3" `
                           -DestinationPath "dist/77MP3-VST3-${{ steps.version.outputs.value }}-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 77MP3-${{ steps.version.outputs.value }}-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 77.MP3 ${{ github.ref_name }}
          files: dist/*
